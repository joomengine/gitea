name: Power and API regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            http: '^2.0'
          - php: '8.3'
            http: '^3.0'
          - php: '8.5'
            http: '^4.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, tokenizer
          coverage: none
          tools: composer:v2
      - name: Install the selected Joomla Framework HTTP generation
        env:
          HTTP_VERSION: ${{ matrix.http }}
        run: |
          composer require --dev --no-update "joomla/http:${HTTP_VERSION}"
          composer update --prefer-dist --no-interaction --no-progress
      - name: Check the pinned API catalog for drift
        run: python3 tools/generate-operations.py --check
      - name: Check authoritative source, generated PHP and API behavior
        run: composer check
